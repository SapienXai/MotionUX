<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Explore and try reusable React interactions in MotionUX Studio." />
    <script>
      try {
        const saved = localStorage.getItem("mx-studio-scheme");
        if (saved === "dark" || saved === "light") document.documentElement.dataset.mxScheme = saved;
      } catch {}
    </script>
    <style>
      html { color-scheme: light dark; }
      html[data-mx-scheme="light"] { background: #f3f3f3; color-scheme: light; }
      html[data-mx-scheme="dark"] { background: #000; color-scheme: dark; }
    </style>
    <title>MotionUX Studio — Motion components</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/studio/main.tsx"></script>
  </body>
</html>
