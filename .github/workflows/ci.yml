name: MotionUX checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Keep the bundled browsers aligned with the locked Playwright version.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:766137e2d9caad4744187e53cdc89320ba6f2eb57cff097374020944b44dd0a9
      options: --user 1001 --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install ZIP verifier from Ubuntu Noble
        run: |
          unzip_package="$RUNNER_TEMP/motionux-unzip.deb"
          curl --fail --silent --show-error --retry 3 --max-time 60 \
            --output "$unzip_package" \
            https://archive.ubuntu.com/ubuntu/pool/main/u/unzip/unzip_6.0-28ubuntu4.1_amd64.deb
          printf '%s  %s\n' a505b9d491386167bd8e14e3383315a4a7d6539e4406745901ccf009a7988271 "$unzip_package" | sha256sum --check
          dpkg-deb --extract "$unzip_package" "$RUNNER_TEMP/motionux-tools"
          printf '%s\n' "$RUNNER_TEMP/motionux-tools/usr/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify
        env:
          MOTIONUX_TEST_PREVIEW: "1"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.30.3"
      - run: pnpm --dir platform install --frozen-lockfile --ignore-scripts
      - name: B11R typed module compiler and independent code/PWA fixture
        run: node platform/tests/b11r-portable.mjs --controls --extended
      - run: node scripts/v9/check-public.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: motionux-playwright-failures
          path: test-results/
          if-no-files-found: ignore
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run registry:build
      - if: github.event_name == 'push'
        run: node scripts/registry-smoke.mjs
      - if: github.event_name == 'pull_request'
        run: node scripts/registry-smoke.mjs --local
  consumer-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        scope: [featured, recipes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run registry:build
      - if: github.event_name == 'push'
        run: node scripts/fixture-parity.mjs --${{ matrix.scope }}-only
      - if: github.event_name == 'pull_request'
        run: node scripts/fixture-parity.mjs --local --${{ matrix.scope }}-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motionux-consumer-${{ matrix.scope }}
          path: test-results/consumer-parity/
          if-no-files-found: ignore

  build-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: "10.30.3"
      - run: npm ci --ignore-scripts
      - run: pnpm --dir platform install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir platform test
      - run: pnpm --dir platform typecheck
      - run: pnpm --dir platform build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium
      - run: node platform/tests/browser.mjs
      - name: B3 CRM clean source export and Chromium smoke
        run: node platform/tests/b3-browser.mjs
      - name: Inspector detects seeded faults and blocks out-of-scope requests
        run: node platform/tests/b6-inspector-faults.mjs
      - name: CRM and Hotel browser audits, offline PWA and Motion DNA parity
        run: node platform/tests/b4-pwa.mjs --inspector
      - name: B8 creator, media and independent hotel export
        run: node platform/tests/b8-browser.mjs
      - name: B9 reusable pages, domain adapters and independent exports
        run: node platform/tests/b9-browser.mjs
      - name: B10 creator, responsive sections and independent Next and PWA apps
        run: node platform/tests/b10-browser.mjs
